; PlatformIO Project Configuration File
; ESP32-C6-DevKitC-1, Arduino framework, NimBLE-Arduino BLE stack
;
; Two interchangeable backends, one shared BLE/crypto/crash-log core
; (src/scale_common.*):
;   - esp32-c6-devkitc-1-wifi:    src/main_wifi.cpp   - WiFi + MQTT Discovery
;   - esp32-c6-devkitc-1-zigbee:  src/main_zigbee.cpp - native Zigbee, joins
;                                 zigbee2mqtt directly (see that file's
;                                 header comment for why you might want this
;                                 instead - in short, a weak WiFi link's
;                                 reconnect churn interacting badly with
;                                 BLE+WiFi radio coexistence).
; Build one explicitly with `pio run -e <name>`; plain `pio run` builds only
; default_envs below.
;
; Notes:
; - Using the "pioarduino" community fork of the espressif32 platform
;   because it tracks newer arduino-esp32 core releases with full,
;   up-to-date ESP32-C6 support faster than the stock PlatformIO registry
;   entry. Swap platform back to the official "espressif32" once your
;   installed PlatformIO registry version is current enough for your needs.
; - NimBLE-Arduino is pulled in explicitly (not the bundled BLEDevice.h
;   shim) - see scale_common.cpp header comment for why.

[platformio]
default_envs = esp32-c6-devkitc-1-wifi

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Persistent NVS-backed boot/crash history log (see scale_common.cpp,
; recordAndDumpBootHistory()) - dumped to serial on every boot so a board
; running on USB-power-only in the field can be diagnosed after a crash just
; by plugging it into a PC, no live capture needed. On by default; set to 0
; to compile it out entirely. Shared by both envs below via their own
; build_flags (PlatformIO doesn't merge a base [env] build_flags with a
; per-env one - it overrides).
; ---------------------------------------------------------------------

[env:esp32-c6-devkitc-1-wifi]
extends = env
build_src_filter = +<*> -<main_zigbee.cpp>

; Pin a known-good NimBLE-Arduino release. Check
; https://github.com/h2zero/NimBLE-Arduino/releases for anything newer
; with additional C6 fixes before you build.
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2

build_flags =
    -D ENABLE_CRASH_LOG=1

; Default partition table only gives ~1.25MB per app slot (sized for OTA
; dual-banking). Adding WiFi + MQTT + ArduinoJson pushed the image past
; that. We don't use OTA, so use huge_app.csv for a single ~3MB app
; partition instead - plenty of headroom on this board's 8MB flash.
board_build.partitions = huge_app.csv

; Optional but recommended: trims BLE memory usage a bit further and
; keeps logs quieter once things are working. Uncomment while not debugging.
; build_flags =
;     -D ENABLE_CRASH_LOG=1
;     -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
;     -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
;     -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED

[env:esp32-c6-devkitc-1-zigbee]
extends = env
build_src_filter = +<*> -<main_wifi.cpp>

lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.1

build_flags =
    -D ENABLE_CRASH_LOG=1
    -D ZIGBEE_MODE_ZCZR

; Zigbee needs its own partition layout (adds zb_storage/zb_fct partitions
; the stack uses for network/pairing state) and only gives a ~1.25MB app
; slot (dual OTA banks) - smaller than huge_app.csv's single 3MB slot, but
; this backend also drops WiFi/PubSubClient/ArduinoJson entirely, so it
; should still fit comfortably.
board_build.partitions = zigbee_zczr.csv
