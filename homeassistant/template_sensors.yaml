# Splits sensor.xiaomi_scale_s200_bridge_weight (published by the firmware
# via MQTT Discovery, always the single most recent reading regardless of
# who it was) into a per-person sensor. Entity ID depends on
# MQTT_CLIENT_ID/device name in secrets.h - check yours under Developer
# Tools -> States if you changed either. The scale's BLE broadcast carries
# no per-user ID, so each reading
# is assigned to whichever of two expected weight ranges it's closer to -
# the same heuristic Xiaomi's own Mi Fit app uses. Overlap between the two
# ranges is fine; ties go to whichever range's midpoint is closer, so a
# reading is never assigned to both.
#
# Tune the four numbers below (40/75 and 60/100) to your own weights.
#
# Install: paste this block under a top-level `template:` key in
# configuration.yaml (or merge it into an existing one), then reload via
# Developer Tools -> YAML -> Template Entities (or restart Home Assistant).
#
# To make the ranges editable from the HA UI instead of hardcoding them
# here, create four input_number helpers (Settings -> Devices & services ->
# Helpers) and replace e.g. `40` with
# `states('input_number.user1_min') | float`.

template:
  - trigger:
      - platform: state
        entity_id: sensor.xiaomi_scale_s200_bridge_weight
    sensor:
      - name: "Weight User 1"
        unique_id: scale_weight_user1
        device_class: weight
        state_class: measurement
        unit_of_measurement: kg
        state: >
          {% set w = trigger.to_state.state | float %}
          {% set mid1 = (40 + 75) / 2 %}
          {% set mid2 = (60 + 100) / 2 %}
          {% if (w - mid1) | abs <= (w - mid2) | abs %}
            {{ w }}
          {% else %}
            {{ this.state }}
          {% endif %}

      - name: "Weight User 2"
        unique_id: scale_weight_user2
        device_class: weight
        state_class: measurement
        unit_of_measurement: kg
        state: >
          {% set w = trigger.to_state.state | float %}
          {% set mid1 = (40 + 75) / 2 %}
          {% set mid2 = (60 + 100) / 2 %}
          {% if (w - mid1) | abs > (w - mid2) | abs %}
            {{ w }}
          {% else %}
            {{ this.state }}
          {% endif %}
